[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "marvepayam-inferopt_jd128"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别大模型推理优化工程师·偏好数据的成对噪声上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "marvepayam" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://marvepayam.github.io"
Repository = "https://github.com/marvepayam/inferopt_jd128"
Issues = "https://github.com/marvepayam/inferopt_jd128/issues"

[project.scripts]
inferopt_jd128 = "inferopt_jd128:main"

[tool.setuptools]
py-modules = ["inferopt_jd128"]
